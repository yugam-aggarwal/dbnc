[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dbnc"
version = "1.0.0"
description = "Differentiable Bayesian Network Classifier for categorical tabular data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Anonymous Authors" },
]
keywords = [
    "bayesian-network-classifier",
    "differentiable-structure-learning",
    "tabular-classification",
    "attention",
    "pytorch",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.2",
]

[project.optional-dependencies]
experiments = ["optuna>=3.6", "openml>=0.14", "xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
figures = ["matplotlib>=3.7"]
all = ["optuna>=3.6", "openml>=0.14", "xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2", "matplotlib>=3.7"]

[project.scripts]
dbnc = "dbnc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
